poll_interval_seconds: 60
state_path: data/state.json

route_watch:
  enabled: true
  state_path: data/route_state.json
  interval_seconds: 1800
  max_backoff_seconds: 7200
  focus_regions:
    - HK
    - TW
    - JP
  directory_url: https://public-us-pingsx.api.clonoth.com/v2/probe/lg/misaka
  websocket_url: wss://public-us-pingsx.api.clonoth.com/v2/probe/ws
  origin: https://misaka.ping.sx
  catalog_api_base: https://app.misaka.io/api/mc2
  directory_timeout_seconds: 20
  measurement_timeout_seconds: 120
  asn_timeout_seconds: 5
  minimum_asn_enrichment_ratio: 0.6
  confirmation_count: 2
  targets:
    - id: telecom_guangdong
      operator: China Telecom
      label: 广东电信
      ip: 202.96.128.86
      expected_asn: AS4134
      expected_prefix: 202.96.128.0/18
    - id: unicom_guangdong
      operator: China Unicom
      label: 广东联通
      ip: 210.21.196.6
      expected_asn: AS17623
      expected_prefix: 210.21.192.0/18
    - id: mobile_guangdong
      operator: China Mobile
      label: 广东移动
      ip: 211.136.192.6
      expected_asn: AS56040
      expected_prefix: 211.136.192.0/18

suspicious_keywords:
  - test
  - beta
  - internal
  - do not buy
  - 测试

providers:
  - name: nexkr
    type: nexkr
    enabled: true
    catalog_url: https://nexkr.sh/api/v1/shop/groups
    interval_seconds: 60
    timeout_seconds: 25
    max_backoff_seconds: 1800

  - name: dmit
    type: dmit
    enabled: true
    catalog_url: https://www.dmit.io/cart.php
    interval_seconds: 60
    timeout_seconds: 35
    isolate_process: true
    scan_timeout_seconds: 75
    scan_memory_high_mb: 700
    scan_memory_max_mb: 800
    failure_retry_seconds: 30
    max_backoff_seconds: 300
    selector_retry_attempts: 1
    selector_retry_backoff_seconds: 2
    fetch_mode: auto
    # DMIT blocks Chromium's headless signature on the currently tested host.
    # Run the watcher under xvfb-run so Playwright can use headed mode.
    browser_headless: false
    browser_args:
      - --disable-blink-features=AutomationControlled
      - --renderer-process-limit=2
    browser_wait_selector: .cart-products-box[pid]
    browser_wait_state: attached
    browser_settle_ms: 1500
    # Optional known/hidden PIDs not present in the catalog. Each adds one
    # cart.php?a=add&pid=... request per DMIT check, so keep this list short.
    extra_pids: []

  - name: blossom
    type: blossom
    enabled: true
    catalog_url: https://blossomhost.us/api/catalog
    interval_seconds: 60
    timeout_seconds: 25
    max_backoff_seconds: 1800

  - name: boilcloud
    type: boilcloud
    enabled: true
    base_url: https://cloud.boil.network/
    store_url: https://cloud.boil.network/index.php?rp=/store
    sitemap_url: https://cloud.boil.network/sitemap.xml
    interval_seconds: 120
    timeout_seconds: 30
    retry_attempts: 2
    retry_backoff_seconds: 1
    max_categories: 100
    max_backoff_seconds: 1800

  - name: fachost
    type: fachost
    enabled: true
    base_url: https://fachost.cloud/
    interval_seconds: 60
    timeout_seconds: 25
    retry_attempts: 2
    retry_backoff_seconds: 1
    max_categories: 100
    max_backoff_seconds: 1800
    # Search-indexed checkout that remains publicly orderable but is intentionally
    # absent from the current storefront navigation. A 404 here means it was removed.
    extra_product_urls:
      - https://fachost.cloud/products/tw-hinet-vds/hinet-vds-lite/checkout

  - name: leikwanhost
    type: leikwanhost
    enabled: true
    base_url: https://buy.leikwanhost.com/
    store_url: https://buy.leikwanhost.com/cart.php
    # WHMCS currency ID 2 is the site's public CNY option. Keep both catalog
    # prices and direct order links in CNY instead of the default HKD session.
    preferred_currency_id: 2
    preferred_currency_code: CNY
    interval_seconds: 120
    timeout_seconds: 30
    retry_attempts: 2
    retry_backoff_seconds: 1
    minimum_categories: 10
    minimum_products: 20
    max_categories: 100
    max_backoff_seconds: 1800

  - name: liqunhuiju
    type: liqunhuiju
    enabled: true
    base_url: https://v3.leikwanhost.com/
    interval_seconds: 60
    timeout_seconds: 25
    max_backoff_seconds: 1800

  - name: vmsilo
    type: vmsilo
    enabled: true
    base_url: https://portal.vmsilo.com/
    store_url: https://portal.vmsilo.com/store
    interval_seconds: 120
    timeout_seconds: 30
    retry_attempts: 2
    retry_backoff_seconds: 1
    minimum_categories: 2
    max_categories: 100
    max_backoff_seconds: 1800

  - name: misaka
    type: misaka
    enabled: true
    api_base: https://app.misaka.io/api/mc2
    buy_base: https://app.misaka.io/iaas/vm/create
    focus_regions:
      - HK
      - TW
      - JP
    focus_region_labels:
      HK: Hong Kong
      TW: Taiwan
      JP: Japan
    interval_seconds: 60
    timeout_seconds: 20
    retry_attempts: 2
    retry_backoff_seconds: 0.5
    minimum_regions: 30
    minimum_global_products: 250
    max_regions: 100
    minimum_region_retention_ratio: 0.8
    minimum_product_retention_ratio: 0.7
    max_backoff_seconds: 1800

