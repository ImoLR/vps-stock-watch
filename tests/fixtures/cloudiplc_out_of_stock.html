<script>
/* 头像加载超时保护：3 秒未完成加载强制切换到 data-avatar-fallback 指定的本地图
   防止 weavatar 等外部头像服务慢/挂时整页"loading"指示长时间不停 */
(function () {
    function setupAvatarTimeout(img) {
        var fb = img.getAttribute('data-avatar-fallback');
        if (!fb) return;
        if (img.complete && img.naturalHeight > 0) return;
        var timer = setTimeout(function () {
            if (!img.complete || img.naturalHeight === 0) {
                img.onerror = null;
                img.src = fb;
            }
        }, 3000);
        img.addEventListener('load', function () { clearTimeout(timer); });
        img.addEventListener('error', function () { clearTimeout(timer); });
    }
    var imgs = document.querySelectorAll('img.avatar-with-timeout');
    for (var i = 0; i < imgs.length; i++) setupAvatarTimeout(imgs[i]);
})();
</script>
