# FACHOST Telegram relay (watcher.fac_tg_watch, its own systemd unit). A
# logged-in user session in data/tg (not in git) reads the vendor channel and
# group; the watcher bot posts the copies. Telegram pushes messages, so there
# is no poll interval; the channel is re-read every 10 min only to catch up.
fac_tg_watch:
  enabled: true
  session_dir: data/tg
  channel_id: -1002582634785
  channel_username: fachost_cloud
  group_id: -1002306171240
  catch_up_seconds: 600
  admin_refresh_seconds: 3600
  # A FAC link from the channel or a group admin also wakes the auto-buyer;
  # keyword-only posts are relayed but don't (user, 2026-11-11).
  autobuy_trigger_dir: data/autobuy/fac_triggers
  # 2026-11-11 (user): BOIL relayed the same way as FAC: every channel post;
  # group messages with a cloud.boil.network link, or a sale-word post from
  # BOIL's own accounts (the group has ~44 community admins and bots, so
  # "admin" is narrowed to staff_usernames). No BOIL auto-buyer: nothing is
  # queued, and hidden links stay notify-only.
  relays:
    - name: BOIL
      channel_id: -1002036810571  # Boil の家裡雲「維護日記」 @BoilsHomelabChannel
      channel_username: BoilsHomelabChannel
      group_id: -1002302355078  # Boil不是Boli的家裡雲 @BoilsHomelab
      link_hosts: [cloud.boil.network]
      # Boil, the shop account and the two support accounts the channel names.
      staff_usernames: [zby88zby, BoilCloud, McDonalds_Boil, mafumafu_i]
      keywords: [
        黑五, black friday, 雙11, 双11, 雙十一, 双十一, 雙12, 双12, 雙十二, 双十二,
        年付, 年繳, 年缴, festive, 節日, 节日, 盲盒, 聖誕, 圣诞, 週年, 周年,
        優惠碼, 优惠码, 折扣碼, 折扣码, 上架, 上新, 補貨, 补货, 限時, 限时, 限量,
        活動, 活动, 開賣, 开卖, 下單鏈接, 下单链接,
      ]
  # 2026-11-10 (user): DMIT channels in the account's VPS公告群 folder, pushed
  # like the FAC channel. Only posts naming a watched special plan are sent;
  # act.dmithost.net short links are resolved to PIDs (one request each).
  # @DMIT_INC (English) is left out: it mirrors @DMIT_INC_CN.
  watch_channels:
    - name: DMIT
      ids:
        - -1001986550569  # DMIT活动推送 @dmitnews
        - -1001343393147  # LANG=zh_CN tail -f /var/log/DMIT.log @DMIT_INC_CN
      resolve_hosts: [act.dmithost.net]
      watched_pids_from: dmit
      keywords:
        旺角 MongKok: [mongkok, 旺角]
        维多利亚 Victoria: [victoria, 维多利亚]
        落马洲 LokMaChau: [lokmachau, 落马洲]
        荃湾 TsuenWan: [tsuenwan, 荃湾]
        弥敦道 Nathan: [nathan, 弥敦]
        品川 Shinagawa: [shinagawa, 品川]
        东京 TINY: ["tyo+tiny", tyoprotiny]
        Malibu: [malibu]
    # Not watched (user, 2026-11-10): @DMITstock -1001785967044 ("DMIT交易/拼车/
    # 补货") is mostly members' buy/sell posts, and its posts reach this
    # account empty (likely on purpose). A trading channel can be added back
    # as its own entry with require_words / skip_words.

# FACHOST auto-buyer (watcher.fac_autobuy, deploy/fac-autobuy.service; user,
# 2026-11-08). It never polls on its own: the TG relay above and the
# fachost_sale provider drop triggers, and each trigger arms its links for
# arm_minutes (polled every fast_poll_seconds for fast_minutes, then every
# slow_poll_seconds). Buys ONE SeedNet (not NAT) annual plan with a total
# today <= max_total, paid from the account balance, then pauses itself.
# Login lives in the Chromium profile (data/fac_profile, not in git).
fac_autobuy:
  enabled: true
  name_include: [seednet]
  name_exclude: [nat]
  max_total: 280
  coupons: []
  default_urls:
    - https://fachost.cloud/products/special-regulations
  arm_minutes: 360
  fast_poll_seconds: 20
  fast_minutes: 30
  slow_poll_seconds: 60
  login_check_hours: 6

suspicious_keywords:
  - test
  - beta
  - internal
  - do not buy
  - 测试

providers:
  - name: nexkr
    type: nexkr
    enabled: true
    catalog_url: https://nexkr.sh/api/v1/shop/groups
    interval_seconds: 60
    timeout_seconds: 25
    max_backoff_seconds: 1800

  # NewNB Cloud: public JSON node list, one product per node + primary NIC.
  # The SH-HK CM launch is handled by watcher.nnb_autobuy, not this poller.
  - name: nnb
    type: nnb
    enabled: true
    interval_seconds: 60
    timeout_seconds: 20
    max_backoff_seconds: 1800

  # 2026-11-10 (user): only DMIT's special plans; the regular catalog is not
  # loaded or reported. One browser session per round opens each order page
  # (pid_spacing_seconds apart); only a restock is notified, or a PID that now
  # sells another product (DMIT moves plans to new PIDs, e.g. Victoria v2).
  # Nathan (弥敦道) is not sold publicly; no PID known. PIDs from @dmitnews
  # short links (act.dmithost.net), resolved 2026-11-09.
  - name: dmit
    type: dmit
    enabled: true
    # 11-09: dmit.io Cloudflare blocks the AWS HK IP -> egress via Boil Hinet 马年 (dmit-egress.service, ssh -D)
    proxy: socks5://127.0.0.1:1081
    interval_seconds: 1800
    timeout_seconds: 45
    isolate_process: true
    scan_timeout_seconds: 300
    scan_memory_high_mb: 700
    scan_memory_max_mb: 800
    failure_retry_seconds: 300
    max_backoff_seconds: 3600
    pid_spacing_seconds: 5
    notify_sold_out: false
    # DMIT blocks Chromium's headless signature on the currently tested host.
    # Run the watcher under xvfb-run so Playwright can use headed mode.
    browser_headless: false
    browser_args:
      - --disable-blink-features=AutomationControlled
      - --renderer-process-limit=2
    browser_settle_ms: 1500
    # keywords: the order page's product name must contain one ("a+b" = both),
    # otherwise the PID is treated as reused for another product.
    watch_pids:
      - {pid: 217, name: HKG.Pro.MongKok, region: Hong Kong, keywords: [mongkok]}
      - {pid: 178, name: HKG.Pro.Victoria, region: Hong Kong, keywords: [victoria]}
      - {pid: 205, name: HKG.Pro.Victoria v2, region: Hong Kong, keywords: [victoria]}
      - {pid: 187, name: HKG.Pro.LokMaChau, region: Hong Kong, keywords: [lokmachau]}
      - {pid: 206, name: HKG.Pro.LokMaChau v2, region: Hong Kong, keywords: [lokmachau]}
      - {pid: 233, name: HKG.Pro.TsuenWan, region: Hong Kong, keywords: [tsuenwan]}
      - {pid: 179, name: TYO.Pro.Shinagawa, region: Tokyo, keywords: [shinagawa]}
      - {pid: 138, name: TYO.Pro.TINY, region: Tokyo, keywords: ["tyo+tiny"]}
      - {pid: 186, name: LAX.Pro.MALIBU, region: Los Angeles, keywords: [malibu]}

  # Off since 2026-11-10 (user): @dmitnews is now pushed through
  # fac_tg_watch.watch_channels; this polled its public web page every 150 s.
  # Kept as a fallback if the TG session is lost.
  - name: dmitnews
    type: tg_channel
    enabled: false
    channel: dmitnews
    interval_seconds: 150
    timeout_seconds: 20
    max_backoff_seconds: 1800
    resolve_hosts: [act.dmithost.net]
    resolve_spacing_seconds: 3
    watched_pids: [217, 178, 205, 187, 206, 233, 179, 138, 186]
    keywords:
      旺角 MongKok: [mongkok, 旺角]
      维多利亚 Victoria: [victoria, 维多利亚]
      落马洲 LokMaChau: [lokmachau, 落马洲]
      荃湾 TsuenWan: [tsuenwan, 荃湾]
      弥敦道 Nathan: [nathan, 弥敦]
      品川 Shinagawa: [shinagawa, 品川]
      东京 TINY: ["tyo+tiny", tyoprotiny]
      Malibu: [malibu]

  # Disabled 2026-11-06 at the user's request; code kept for a later rerun.
  - name: blossom
    type: blossom
    enabled: false
    catalog_url: https://blossomhost.us/api/catalog
    interval_seconds: 60
    timeout_seconds: 25
    max_backoff_seconds: 1800

  # Full catalog scan, disabled 2026-11-07 at the user's request; replaced by
  # boilcloud_sale below plus the BOIL Telegram relay (fac_tg_watch.relays).
  # Code kept.
  - name: boilcloud
    type: boilcloud
    enabled: false
    base_url: https://cloud.boil.network/
    store_url: https://cloud.boil.network/index.php?rp=/store
    sitemap_url: https://cloud.boil.network/sitemap.xml
    interval_seconds: 600
    timeout_seconds: 30
    retry_attempts: 2
    retry_backoff_seconds: 1
    max_categories: 100
    max_backoff_seconds: 1800

  # BOILCLOUD sale watch (user, 2026-11-11, aligned with fachost_sale). Holiday
  # items are sold from the hidden group gid 44 store/festive-offer (empty
  # between sales) or as new PIDs in hidden zone groups; the links are posted
  # on BOIL's channel. One request per round reads festive-offer (empty ->
  # listed alerts; its cards carry stock). Every 3rd round (15 min) the open
  # productsinfo feed probes 2 PIDs above the highest seen (528 on 11-11);
  # a new PID is reported once with its prices (4 more requests). ~480
  # requests/day. Notify only: these are hidden links, nothing orders them.
  - name: boilcloud_sale
    type: boilcloud_sale
    enabled: true
    base_url: https://cloud.boil.network/
    categories: [festive-offer]
    interval_seconds: 300
    feed_every_rounds: 3
    probe_ahead: 2
    feed_start_pid: 528
    currency_id: 1
    timeout_seconds: 25
    request_spacing_seconds: 5
    max_backoff_seconds: 3600

  # Disabled 2026-11-07 at the user's request: sale items are hidden links
  # posted in FACHOST's Telegram group, not on the store pages. Code kept.
  - name: fachost
    type: fachost
    enabled: false
    base_url: https://fachost.cloud/
    interval_seconds: 300
    timeout_seconds: 25
    retry_attempts: 2
    retry_backoff_seconds: 1
    max_categories: 100
    max_backoff_seconds: 1800
    # Search-indexed checkout that remains publicly orderable but is intentionally
    # absent from the current storefront navigation. A 404 here means it was removed.
    extra_product_urls:
      - https://fachost.cloud/products/tw-hinet-vds/hinet-vds-lite/checkout

  # FACHOST hidden sale category (user, 2026-11-07). Black Friday 2025 and
  # the 2026 anniversary (SeedNet annual plans) were sold from
  # products/special-regulations, which is 404 between sales. One request
  # per round while closed (~290/day); while open, one more per in-stock
  # product to read its billing plans (monthly / annual ...).
  - name: fachost_sale
    type: fachost_sale
    enabled: true
    base_url: https://fachost.cloud/
    categories: [special-regulations]
    interval_seconds: 300
    autobuy_trigger_dir: data/autobuy/fac_triggers
    timeout_seconds: 25
    request_spacing_seconds: 5
    max_backoff_seconds: 3600

  - name: leikwanhost
    type: leikwanhost
    enabled: true
    base_url: https://buy.leikwanhost.com/
    store_url: https://buy.leikwanhost.com/cart.php
    # WHMCS currency ID 2 is the site's public CNY option. Keep both catalog
    # prices and direct order links in CNY instead of the default HKD session.
    preferred_currency_id: 2
    preferred_currency_code: CNY
    interval_seconds: 600
    timeout_seconds: 30
    retry_attempts: 2
    retry_backoff_seconds: 1
    minimum_categories: 10
    minimum_products: 20
    max_categories: 100
    max_backoff_seconds: 1800

  # Disabled 2026-10-28 at the user's request: the portal has no public
  # products and the leikwanhost scan already covers LeiKwan stock.
  - name: liqunhuiju
    type: liqunhuiju
    enabled: false
    base_url: https://v3.leikwanhost.com/
    interval_seconds: 60
    timeout_seconds: 25
    max_backoff_seconds: 1800

  - name: vmsilo
    type: vmsilo
    enabled: true
    base_url: https://portal.vmsilo.com/
    store_url: https://portal.vmsilo.com/store
    interval_seconds: 120
    timeout_seconds: 30
    retry_attempts: 2
    retry_backoff_seconds: 1
    minimum_categories: 2
    max_categories: 100
    max_backoff_seconds: 1800
    order_page_refresh_seconds: 1800

  # CloudIPLC (云际互联): WHMCS category pages over HTTP every 5 min (~7
  # requests, 5 s apart). New products and hidden links only (user,
  # 2026-11-06): every 3rd round (15 min) the open productsinfo feed probes
  # the 3 PIDs above the highest seen; one no group lists is a hidden direct
  # link. Stock lives only on the EdgeOne-guarded cart.php?a=add (isolated
  # Chromium), so that check is off. Never retried on a block page.
  # Disabled 2026-11-07 at the user's request; code kept for a later rerun.
  - name: cloudiplc
    type: cloudiplc
    enabled: false
    base_url: https://www.cloudiplc.com/
    interval_seconds: 300
    timeout_seconds: 30
    request_spacing_seconds: 5
    retry_attempts: 2
    max_categories: 40
    minimum_products: 10
    max_backoff_seconds: 3600
    notify_only_new: true
    hidden_probe: true
    hidden_probe_every_rounds: 3
    hidden_probe_ahead: 3
    # Highest PID on 2026-11-06 (160 "IPLC TY-NAT 双12活动款"); 148-160 are
    # older hidden or retired items and must not alert as new.
    hidden_probe_baseline_pid: 160
    order_page_check: false
    order_page_refresh_seconds: 7200
    order_page_retry_seconds: 1800
    # Sale items only reachable by a direct order link; no category lists them.
    direct_products:
      - pid: 125
        name: IPLC TY-NAT 限时限量 [双十一]
        category: 活动直链
    scan_memory_high_mb: 600
    scan_memory_max_mb: 700
    browser_headless: false
    browser_args:
      - --disable-blink-features=AutomationControlled
      - --renderer-process-limit=2

  # HighEndNetwork (HEN): Cloudflare challenges /store/... and cart.php, but
  # the same store pages at index.php?rp=/store/... are not challenged. Every
  # 2-min round reads the TPE + Promotion categories ("N Available") and the
  # hidden Matcha direct link = 3 requests. Every 5th round (10 min) the open
  # productsinfo feed also re-reads 2 names, probes 2 PIDs above the highest
  # (new hidden sale links) and refreshes 4 prices of one watched product
  # = 8 requests. 5 s apart; ~3.3k/day. Seednet only (user, 2026-11-06
  # 22:50): every alert (new / removed / store-page moves / price / stock /
  # name) is limited to Seednet names; nothing else notifies.
  - name: highend
    type: highend
    enabled: true
    base_url: https://billing.highendnetwork.com/
    currency_id: 1
    interval_seconds: 120
    timeout_seconds: 20
    request_spacing_seconds: 5
    retry_attempts: 2
    watch_keywords:
      - seednet
    watched_only: true
    store_pages:
      - /store/tpe-home-broadband
      - /store/promotion
    direct_links:
      "20": /store/promotion/tpe-seednet-matcha
    feed_every_rounds: 5
    sweep_batch: 2
    probe_ahead: 2
    far_probe_span: 0
    price_batch: 1
    discovery_misses: 40
    minimum_products: 10
    max_backoff_seconds: 3600

  # TCSCloud (Taipei home-broadband VPS): category cards carry "N 可用"; hidden
  # and direct-link PIDs come from the productsinfo feed and their order pages.
  # SeedNet only. ~1.5k requests/day: 2 categories every round (SeedNet card
  # stock + price every 5 min), feed probes every 2nd round (a new SeedNet PID
  # anywhere), hourly SeedNet feed prices and retired-SeedNet order pages.
  - name: tcscloud
    type: tcscloud
    enabled: true
    base_url: https://billing.tcscloud.net/
    start_category: taiwan-vps-dynamic
    # SeedNet only lives in these two; Premium / ECO pages are not read.
    categories: [taiwan-vps-dynamic, taiwan-vps-fixed]
    currency_id: 1
    interval_seconds: 300
    timeout_seconds: 20
    request_spacing_seconds: 5
    retry_attempts: 2
    focus_regions:
      - TW
    # 2026-11-06 scan: pid 1-80 empty except 24 (TCP-BBR add-on), 120-170 empty.
    feed_start_pid: 80
    discovery_misses: 20
    feed_every_rounds: 2
    probe_ahead: 2
    far_probe_span: 10
    name_batch: 1
    order_check_batch: 2
    # Watched PIDs without a card count (new hidden ones): every round.
    order_check_seconds: 300
    retired_check_seconds: 3600
    # Per-cycle feed prices of watched products (SeedNet), one per round.
    feed_price_seconds: 3600
    feed_price_batch: 1
    # Not VPS: 24 TCP-BBR add-on, 89 TWNIC IP rental, 90 dedicated/colocation.
    ignore_pids: [24, 89, 90]
    # 2026-11-06 user: stock / restock / sold-out / price alerts and order-page
    # checks only for SeedNet (遠傳 FET) products. New PIDs, removals and
    # store-front moves are still reported for every product.
    stock_watch_keywords: [seednet, seed-, fet-, -fet]
    # A PID created after the baseline (possible pre-made sale link) is watched
    # too, whatever the ISP, so its opening alerts.
    watch_new_pids: false
    # 2026-11-06 22:4x user: "只查 SeedNet，其他全部不查" — non-SeedNet PIDs are
    # not checked, kept or reported at all (not even new / removed).
    watched_only: true
    # The hidden "legacy" group holds only HiNet/KBT items; its PIDs stay
    # tracked through the feed.
    read_hidden_groups: false
    minimum_categories: 2
    minimum_products: 5
    stock_count_alerts: true
    max_backoff_seconds: 3600

  - name: misaka
    type: misaka
    enabled: true
    api_base: https://api.misaka.io/mc2
    buy_base: https://app.misaka.io/iaas/vm/create
    focus_regions:
      - HK
      - TW
      - JP
    focus_region_labels:
      HK: Hong Kong
      TW: Taiwan
      JP: Japan
    interval_seconds: 7200
    timeout_seconds: 20
    retry_attempts: 2
    retry_backoff_seconds: 0.5
    minimum_regions: 30
    minimum_global_products: 250
    max_regions: 100
    minimum_region_retention_ratio: 0.8
    minimum_product_retention_ratio: 0.7
    max_backoff_seconds: 7200

